# rust_h264 0.4.0 from crates.io (https://github.com/roticv/rust_h264), with the
# fixes listed in PATCHES.md. Its tests need upstream's testdata/, not copied here.
[package]
name = "rust_h264"
version = "0.4.0"
edition = "2021"
description = "Pure Rust H.264/AVC video decoder"
license = "MIT OR Apache-2.0"
repository = "https://github.com/roticv/rust_h264"
publish = false

[lib]
path = "src/lib.rs"

[features]
dev-internals = []
